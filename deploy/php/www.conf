; Shared php-fpm pool. The container runs as APP_UID:APP_GID (see docker-compose.yaml), so no
; user/group directives here. Per-server changes go into config/php-fpm/zz-override.conf.
; The image's zz-docker.conf sets `listen = 9000` and `daemonize = no`.

[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Pass the container environment (config/secrets/app.env) to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

ping.path = /fpm-ping
