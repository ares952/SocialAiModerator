; Shared PHP configuration for php-fpm and the worker. Per-server changes go into
; config/php/zz-override.ini (template: deploy/php/zz-override.ini.template).

[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 2M
upload_max_filesize = 2M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
variables_order = "EGPCS"
default_charset = "UTF-8"
; Sets umask 0002 for every PHP process (shared development group).
auto_prepend_file = /usr/local/etc/php/umask.php

[Date]
; Same as the database (deploy/mariadb/my.cnf default-time-zone). The administration converts
; to the display time zone (parameter `timezone` in config/common.neon).
date.timezone = UTC

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
