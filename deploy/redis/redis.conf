# Redis for the PHP sessions of the administration. Shared by every server; the service has no
# published port and is reachable only from the compose network `app`.

# Without a password Redis accepts only loopback clients in protected mode; php-fpm connects
# over the internal network, which is the only access path.
protected-mode no
port 6379

# Sessions last up to a year: persist them across restarts.
dir /data
appendonly yes
appendfsync everysec
save 3600 1

# Every session key has a TTL (session.gc_maxlifetime, one year), anonymous visits of the sign-in
# page included. A memory cap keeps such sessions from growing without limit; when it is reached,
# the sessions unused for the longest time are evicted (those operators sign in again) instead of
# failing every session write.
maxmemory 128mb
maxmemory-policy volatile-lru
