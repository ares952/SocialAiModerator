user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client IP from the reverse proxy (LOCAL config/nginx/trusted-proxies.inc), used for
    # logging and the maintenance allowlist. PHP still receives the original connection address
    # (see conf.d/default.conf), because Nette evaluates the proxy headers itself (http.proxy).
    include /etc/nginx/local/trusted-proxies.inc;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr via $realip_remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Meta webhook batches are small; admin has no uploads in v1.
    client_max_body_size 2m;

    # Clients that bypass maintenance (LOCAL config/nginx/maintenance-allowlist.geo).
    geo $maintenance_bypass {
        default 0;
        include /etc/nginx/local/maintenance-allowlist.geo;
    }

    include /etc/nginx/conf.d/*.conf;
}
