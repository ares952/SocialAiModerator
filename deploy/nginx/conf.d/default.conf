server {
    listen 80 default_server;
    server_name _;
    root /var/www/www;
    index index.php;

    # Maintenance: active while temp/maintenance.lock exists (bin/maintenance on|off).
    # Health probes and the maintenance assets stay reachable; allowlisted clients bypass it.
    # Meta retries webhooks answered with 503, so no event is lost during maintenance.
    set $maintenance 0;
    if (-f /var/www/temp/maintenance.lock) {
        set $maintenance 1;
    }
    if ($maintenance_bypass = 1) {
        set $maintenance 0;
    }
    # $request_uri, not $uri: try_files' internal redirect to /index.php re-runs these checks.
    if ($request_uri ~ ^/(health/|__maintenance__/)) {
        set $maintenance 0;
    }
    if ($maintenance = 1) {
        return 503;
    }

    error_page 503 @maintenance;

    location @maintenance {
        root /var/www/www-maintenance;
        try_files /index.html =503;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /__maintenance__/ {
        alias /var/www/www-maintenance/;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Resolve `php` at request time (Docker DNS), so recreating the php container alone does not
    # leave nginx with a stale address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    location = /index.php {
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # The connection address, not the realip-resolved client: Nette trusts X-Forwarded-*
        # only from the proxy listed in http.proxy (config/local.neon).
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        # httpoxy mitigation
        fastcgi_param HTTP_PROXY "";
    }

    # No other PHP file in www/ is executable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
